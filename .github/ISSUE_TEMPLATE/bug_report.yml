name: Bug report
description: Report a reproducible problem with the browser converter
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include preset, settings, and browser.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: PLY details
      description: Share header/counts only; do not upload private assets.
