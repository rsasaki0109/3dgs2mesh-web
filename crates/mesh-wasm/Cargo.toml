[package]
name = "mesh-wasm"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "WebAssembly bindings for the 3DGS2Mesh Web geometry core"
repository = "https://github.com/rsasaki0109/3dgs2mesh-web"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mesh-core = { path = "../mesh-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
